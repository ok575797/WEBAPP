<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인사 친구와 바르게 인사해요</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#fff4fa,#e9f7ff);
font-family:"Noto Sans KR",sans-serif;
}

.app{
width:95%;
max-width:430px;
height:90vh;
background:white;
border-radius:30px;
overflow:hidden;
box-shadow:0 10px 30px #ccc;
}

.start{
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.logo{
font-size:70px;
}

h1{
color:#ff8fab;
}

input{
padding:15px;
border-radius:20px;
border:2px solid #ffd6e0;
font-size:20px;
text-align:center;
}

button{
margin:15px;
padding:15px 30px;
border:none;
border-radius:25px;
background:#ff9fba;
color:white;
font-size:18px;
}

.chatScreen{
display:none;
height:100%;
flex-direction:column;
}

.header{
background:#ffb6c9;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.info{
text-align:center;
padding:10px;
}

.chat{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
padding:12px;
margin:10px;
border-radius:20px;
max-width:80%;
font-size:18px;
}

.ai{
background:#eee;
}

.user{
background:#ffe0ec;
margin-left:auto;
}

.bottom{
display:flex;
padding:10px;
}

.bottom input{
flex:1;
}

</style>
</head>


<body>

<div class="app">

<div class="start" id="start">

<div class="logo">😊</div>

<h1>
인사 친구와<br>
바르게 인사해요!
</h1>

<p>이름을 알려주세요 💛</p>

<input id="name" placeholder="내 이름">

<button onclick="startGame()">시작하기</button>

</div>



<div class="chatScreen" id="screen">

<div class="header">
😊 인사 친구
</div>

<div class="info">
<span id="student"></span>의 인사 연습<br>
<span id="star">☆☆☆☆☆</span>
</div>


<div class="chat" id="chat"></div>


<div class="bottom">

<input id="answer" placeholder="인사를 입력하세요">

<button onclick="send()">💬</button>

</div>

</div>

</div>



<script>

let name="";
let index=0;
let stars=0;


const data=[

{
title:"부모님께 학교 갈 때",
npc:"👩 엄마",
q:"학교 갈 때 부모님께 어떻게 인사할까?",
a:["다녀오겠습니다","다녀올게요"],
hint:"'다녀오겠습니다'라고 말해볼까?"
},

{
title:"밥 먹을 때",
npc:"🍚 가족",
q:"밥 먹기 전에 어떤 말을 할까?",
a:["잘 먹겠습니다"],
hint:"'잘 ○○겠습니다'라고 말해볼까?"
},

{
title:"선생님께",
npc:"👩‍🏫 선생님",
q:"선생님을 만나면 어떻게 인사할까?",
a:["안녕하세요","선생님 안녕하세요"],
hint:"공손한 인사를 해볼까?"
},

{
title:"친구에게 사과",
npc:"🧒 친구",
q:"친구 물건을 떨어뜨렸어. 뭐라고 할까?",
a:["미안해","죄송해","미안합니다"],
hint:"사과하는 말을 해볼까?"
},

{
title:"친구에게 고마움",
npc:"🧒 친구",
q:"친구가 도와줬어. 뭐라고 할까?",
a:["고마워","감사합니다","고마워요"],
hint:"고마운 마음을 표현해볼까?"
}

];


function startGame(){

name=document.getElementById("name").value.trim();

if(!name){
alert("이름을 입력해주세요!");
return;
}

localStorage.setItem("student",name);

document.getElementById("start").style.display="none";
document.getElementById("screen").style.display="flex";

document.getElementById("student").innerHTML=name+" ";

ai("안녕 "+name+"아! 😊<br>오늘은 바른 인사를 연습해보자!");

setTimeout(next,1000);

}


function ai(text){

let div=document.createElement("div");
div.className="msg ai";
div.innerHTML=text;

document.getElementById("chat").appendChild(div);

scroll();

}


function user(text){

let div=document.createElement("div");
div.className="msg user";
div.innerHTML=text;

document.getElementById("chat").appendChild(div);

scroll();

}


function next(){

if(index>=data.length){

finish();
return;

}

let s=data[index];

ai(
"🎯 <b>"+s.title+"</b><br><br>"+
s.npc+"<br>"+
s.q
);

}



function send(){

let input=document.getElementById("answer");
let text=input.value.trim();

if(!text)return;

user(text);

input.value="";


let s=data[index];


let ok=s.a.some(x=>text.includes(x));


setTimeout(()=>{

if(ok){

stars++;

document.getElementById("star").innerHTML=
"⭐".repeat(stars)+"☆".repeat(5-stars);


ai("🎉 정말 잘했어! "+name+"아<br>멋진 인사였어!");

index++;

setTimeout(next,1200);


}else{

ai(
"😊 다시 생각해볼까?<br>"+
"💡 힌트: "+s.hint
);

}


},500);


}



function finish(){

ai(
"🎉🎉🎉<br><br>"+
name+"아!<br>"+
"모든 인사를 성공했어!<br>"+
"🏆 인사왕이 되었어!"
);

}


window.onload=function(){

let saved=localStorage.getItem("student");

if(saved){
document.getElementById("name").value=saved;
}

}

</script>

</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>인사 친구와 바르게 인사해요</title>

<style>

*{
 box-sizing:border-box;
 font-family:"Noto Sans KR",sans-serif;
}

body{
 margin:0;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 background:linear-gradient(#fff4fa,#eaf7ff);
}

.app{
 width:95%;
 max-width:430px;
 height:90vh;
 background:white;
 border-radius:30px;
 overflow:hidden;
 box-shadow:0 10px 30px rgba(0,0,0,.15);
}


/* 시작 화면 */

.start{
 height:100%;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:30px;
}

.logo{
 font-size:70px;
}

h1{
 color:#ff8fab;
 font-size:30px;
}

p{
 font-size:18px;
}


input{
 width:85%;
 padding:15px;
 border-radius:20px;
 border:3px solid #ffd6e0;
 font-size:20px;
 text-align:center;
}


button{
 margin-top:15px;
 padding:15px 30px;
 border:0;
 border-radius:30px;
 background:#ff9fba;
 color:white;
 font-size:18px;
 cursor:pointer;
}



/* 게임 화면 */

.game{
 display:none;
 height:100%;
 flex-direction:column;
}


.header{
 background:#ffb6c9;
 color:white;
 padding:18px;
 text-align:center;
 font-size:24px;
}


.info{
 text-align:center;
 padding:10px;
 background:#fff5f8;
}


.character{
 text-align:center;
 font-size:45px;
 padding:5px;
}


.chat{
 flex:1;
 overflow-y:auto;
 padding:15px;
}


.message{
 max-width:80%;
 padding:12px 16px;
 margin:10px 0;
 border-radius:20px;
 font-size:18px;
 line-height:1.5;
}


.ai{
 background:#eeeeee;
}


.user{
 background:#ffe0ec;
 margin-left:auto;
}


.bottom{
 display:flex;
 padding:10px;
}


.bottom input{
 flex:1;
 width:auto;
}


.send{
 margin:0 0 0 10px;
 padding:10px 20px;
}


.star{
 color:#ffd700;
 font-size:22px;
}


.thinking{
 color:#999;
}


</style>

</head>


<body>


<div class="app">


<div class="start" id="start">


<div class="logo">
😊
</div>


<h1>
인사 친구와<br>
바르게 인사해요!
</h1>


<p>
이름을 알려주면<br>
인사 친구가 불러줄게요 💛
</p>


<input id="nameInput" placeholder="내 이름">


<button onclick="startGame()">
시작하기 🚀
</button>


</div>



<div class="game" id="game">


<div class="header">
😊 인사 친구
</div>


<div class="character" id="character">
🐰
</div>


<div class="info">

<span id="student"></span>의 인사 연습

<br>

<span class="star" id="stars">
☆☆☆☆☆
</span>

</div>



<div class="chat" id="chat">

</div>



<div class="bottom">

<input id="answer"
placeholder="인사를 입력해 보세요">


<button class="send" onclick="sendAnswer()">
💬
</button>


</div>


</div>


</div>


<script>

let studentName="";
let situation=0;
let stars=0;


const situations=[

{
title:"부모님께 학교 갈 때 인사",
emoji:"👩",
question:"학교에 가기 전에 부모님께 어떻게 인사할까?",
answers:["다녀오겠습니다","다녀올게요","잘 다녀오겠습니다"],
hint:"학교에 갔다가 돌아오겠다는 말을 해볼까?"
},


{
title:"밥 먹을 때 인사",
emoji:"🍚",
question:"맛있는 밥을 먹기 전에 어떤 말을 할까?",
answers:["잘 먹겠습니다"],
hint:"'잘 ○○겠습니다'라고 말해볼까?"
},


{
title:"선생님께 인사",
emoji:"👩‍🏫",
question:"학교에서 선생님을 만나면 어떻게 인사할까?",
answers:["안녕하세요","선생님 안녕하세요","안녕하십니까"],
hint:"공손하게 인사하는 말을 해볼까?"
},


{
title:"친구에게 실수했을 때",
emoji:"🧒",
question:"친구 물건을 떨어뜨렸어. 어떻게 말할까?",
answers:["미안해","미안합니다","죄송해"],
hint:"친구에게 사과하는 말을 해볼까?"
},


{
title:"친구에게 고마울 때",
emoji:"🧒",
question:"친구가 도와줬어. 뭐라고 말할까?",
answers:["고마워","고마워요","감사합니다"],
hint:"고마운 마음을 표현해볼까?"
}

];
function startGame(){

studentName =
document.getElementById("nameInput").value.trim();


if(studentName===""){
alert("이름을 입력해주세요 😊");
return;
}


localStorage.setItem("studentName",studentName);


document.getElementById("start").style.display="none";
document.getElementById("game").style.display="flex";


document.getElementById("student").innerHTML =
studentName+" ";


addAI(
"안녕 "+studentName+"아! 😊<br>"+
"나는 인사 친구야.<br>"+
"오늘은 바른 인사를 연습해 볼 거야!"
);


setTimeout(()=>{

nextSituation();

},1000);

}



function addAI(text){

let div=document.createElement("div");

div.className="message ai";

div.innerHTML=text;


document.getElementById("chat")
.appendChild(div);


scrollBottom();

}



function addUser(text){

let div=document.createElement("div");

div.className="message user";

div.innerHTML=text;


document.getElementById("chat")
.appendChild(div);


scrollBottom();

}



function scrollBottom(){

let chat=document.getElementById("chat");

chat.scrollTop=chat.scrollHeight;

}




function nextSituation(){


if(situation>=situations.length){

finish();

return;

}


let s=situations[situation];


document.getElementById("character")
.innerHTML=s.emoji;



addAI(

"🎯 <b>"+s.title+"</b><br><br>"+
s.emoji+"<br>"+
s.question

);


}



function sendAnswer(){


let input=document.getElementById("answer");

let text=input.value.trim();



if(text===""){
return;
}


addUser(text);

input.value="";



let s=situations[situation];



showThinking();



setTimeout(()=>{


removeThinking();



let correct=false;



for(let answer of s.answers){


if(text.replace(/\s/g,"")
.includes(answer.replace(/\s/g,""))){

correct=true;

break;

}

}




if(correct){


stars++;


updateStars();



let praise=[

"정말 멋진 인사야! 😊",

"와! 바른 마음이 느껴져! 🌈",

"최고야! 친구가 기뻐할 거야! ⭐",

"참 예쁜 말을 사용했어! 💛"

];


let randomPraise =
praise[Math.floor(Math.random()*praise.length)];



addAI(

"🎉 "+randomPraise+
"<br><br>"+
"⭐ 별 하나를 얻었어!"

);



situation++;



setTimeout(()=>{

nextSituation();

},1500);



}else{


addAI(

"😊 "+studentName+"아, 다시 생각해 볼까?<br><br>"+
"💡 힌트: "+s.hint

);



}



},800);



}



function showThinking(){


let div=document.createElement("div");

div.id="thinking";

div.className="message ai thinking";

div.innerHTML=
"😊 인사 친구가 생각 중이에요..." ;


document.getElementById("chat")
.appendChild(div);


scrollBottom();

}



function removeThinking(){


let t=document.getElementById("thinking");


if(t){

t.remove();

}


}



function updateStars(){


let result="";


for(let i=0;i<5;i++){


if(i<stars){

result+="⭐";

}else{

result+="☆";

}

}


document.getElementById("stars")
.innerHTML=result;


}



function finish(){


addAI(

"🎉🎉🎉<br><br>"+
studentName+"아! 정말 잘했어!<br>"+
"다섯 가지 인사 연습을 모두 성공했어.<br><br>"+
"🏆 이제 인사왕이야!"

);



setTimeout(()=>{

showCertificate();

},2000);


}
function showCertificate(){


let chat=document.getElementById("chat");

chat.innerHTML="";


let today=new Date();

let date =
today.getFullYear()+"년 "+
(today.getMonth()+1)+"월 "+
today.getDate()+"일";



let div=document.createElement("div");


div.style.textAlign="center";


div.innerHTML=

`

<div style="
background:#fffbea;
border:5px solid #ffd700;
border-radius:25px;
padding:25px;
">


<div style="font-size:60px;">
🏆
</div>


<h2 style="color:#ff8fab;">
인사왕 수료증
</h2>


<p>
<strong>${studentName}</strong> 학생은
</p>


<p>
🌸 부모님께 인사하기<br>
🍚 식사할 때 인사하기<br>
🏫 선생님께 인사하기<br>
💛 친구에게 사과하기<br>
🌈 친구에게 고마움 전하기
</p>


<p>
다섯 가지 인사 연습을<br>
모두 성공하였습니다.
</p>


<div style="font-size:35px;">
⭐⭐⭐⭐⭐
</div>


<p>
바른 인사를 실천하는<br>
멋진 어린이가 되었어요!
</p>


<p>
${date}
</p>


<button onclick="printCertificate()">
🖨️ 수료증 출력
</button>


<br>


<button onclick="restart()">
🔄 다시 연습하기
</button>


</div>

`;



chat.appendChild(div);


}




function printCertificate(){

window.print();

}





function restart(){


situation=0;

stars=0;


updateStars();


document.getElementById("chat").innerHTML="";


addAI(

"😊 다시 만나서 반가워 "+
studentName+"아!<br>"+
"이번에도 바른 인사를 연습해 볼까?"

);



setTimeout(()=>{

nextSituation();

},1000);


}




window.onload=function(){


let saved=
localStorage.getItem("studentName");



if(saved){

document.getElementById("nameInput")
.value=saved;

}


}



</script>


</body>
</html>
